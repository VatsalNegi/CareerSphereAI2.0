<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CareerSphere AI 2.0</title>
    <link rel="stylesheet" href="global.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container { max-width: 1100px; margin: 60px auto; padding: 20px; }
        .panel { 
            background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 40px; border-radius: 24px; backdrop-filter: blur(25px); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); color: #f8fafc;
            position: relative; overflow: hidden;
        }
        .panel::after {
            content: ''; position: absolute; width: 300px; height: 300px; background: #7000ff; filter: blur(100px);
            top: -150px; right: -150px; opacity: 0.1; transition: all 0.5s ease; border-radius: 50%; pointer-events: none;
        }
        .panel h1 { font-size: 2.2rem; margin-bottom: 10px; font-weight: 700; color: #f8fafc; }
        .panel p { color: #94a3b8; margin-bottom: 30px; font-size: 1.1rem; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 1;}
        th, td { padding: 18px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(255,255,255,0.05); color: #cbd5e1; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        td { background: rgba(0,0,0,0.2); color: #f1f5f9; }
        .status-pending { color: #f39c12; font-weight: 600; padding: 6px 12px; background: rgba(243, 156, 18, 0.15); border-radius: 50px; border: 1px solid rgba(243, 156, 18, 0.3); }
        .status-approved { color: #2ecc71; font-weight: 600; padding: 6px 12px; background: rgba(46, 204, 113, 0.15); border-radius: 50px; border: 1px solid rgba(46, 204, 113, 0.3); }
        .status-rejected { color: #e74c3c; font-weight: 600; padding: 6px 12px; background: rgba(231, 76, 60, 0.15); border-radius: 50px; border: 1px solid rgba(231, 76, 60, 0.3); }
        .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 8px; transition: 0.3s; color: white; }
        .approve-btn { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; color: #2ecc71; }
        .approve-btn:hover { background: #2ecc71; color: white; box-shadow: 0 0 15px rgba(46, 204, 113, 0.4); transform: translateY(-2px); }
        .reject-btn { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; }
        .reject-btn:hover { background: #e74c3c; color: white; box-shadow: 0 0 15px rgba(231, 76, 60, 0.4); transform: translateY(-2px); }
        
        .logout-btn { background: rgba(255, 255, 255, 0.05) !important; color: #f8fafc !important; cursor: pointer; border: 1px solid rgba(255,255,255,0.1) !important; font-family: inherit; font-size: inherit; }
        .logout-btn:hover { background: #e74c3c !important; border-color: transparent !important; box-shadow: 0 0 15px rgba(231, 76, 60, 0.4) !important; }
    </style>
</head>
<body>
    <header>
        <a href="user_dashboard.html" class="logo">Career<span>Sphere</span> AI <span>2.0</span></a>
        <nav>
            <ul>
                <li><a href="user_dashboard.html">Dashboard</a></li>
                <li><button onclick="logout()" class="nav-btn logout-btn">Logout</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="panel">
            <h1>Admin Approval Panel</h1>
            <p>Manage user registration requests securely.</p>
            <table id="userTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/vatsal-negi-3624a12b6/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://github.com/VatsalNegi" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.instagram.com/vatsal.negi/" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
        <div class="footer-bottom">
            &copy; 2026 CareerSphere AI 2.0. Built with ❤️ by Vatsal Negi.
        </div>
    </footer>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function fetchUsers() {
            try {
                const response = await fetch('/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await response.json();
                const list = document.getElementById('userList');
                list.innerHTML = '';
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="status-${user.status}">${user.status.toUpperCase()}</span></td>
                        <td>
                            ${user.status === 'pending' ? `
                                <button class="btn approve-btn" onclick="updateStatus('${user.email}', 'approved')">Approve</button>
                                <button class="btn reject-btn" onclick="updateStatus('${user.email}', 'rejected')">Reject</button>
                            ` : '<span style="color: #94a3b8; font-style: italic;">No Action Required</span>'}
                        </td>
                    `;
                    list.appendChild(tr);
                });
            } catch (error) {
                alert('Failed to fetch users');
            }
        }

        async function updateStatus(email, status) {
            try {
                const response = await fetch('/admin/approve', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email, status })
                });
                if (response.ok) {
                    alert(`User ${status} successfully!`);
                    fetchUsers();
                }
            } catch (error) {
                alert('Action failed');
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        fetchUsers();
    </script>
</body>
</html>
