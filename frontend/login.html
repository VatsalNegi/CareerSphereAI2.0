<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerSphere AI 2.0</title>
    <link rel="stylesheet" href="global.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        main { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 150px); position: relative; padding: 2rem; }
        .auth-container { 
            width: 100%; max-width: 450px; 
            padding: 40px; 
            background: rgba(15, 23, 42, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        .auth-container::before {
            content: ''; position: absolute; width: 150px; height: 150px; background: #7000ff; filter: blur(70px); top: -50px; right: -50px; opacity: 0.2; border-radius: 50%; z-index: -1;
        }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 700; font-size: 2rem; color: #f8fafc; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 500; color: #cbd5e1; }
        input { 
            width: 100%; padding: 14px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            color: white; 
            box-sizing: border-box; 
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: #00d2ff; background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        button { 
            width: 100%; padding: 16px; 
            background: linear-gradient(135deg, #7000ff, #00d2ff); 
            color: white; border: none; border-radius: 12px; 
            font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 10px 20px rgba(112, 0, 255, 0.3);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(112, 0, 255, 0.5); }
        .links { text-align: center; margin-top: 25px; font-size: 0.95rem; color: #94a3b8; }
        .links a { color: #00d2ff; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .links a:hover { color: #ffffff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
    </style>
</head>
<body>
    <header>
        <a href="home.html" class="logo">Career<span>Sphere</span> AI <span>2.0</span></a>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="register.html" class="nav-btn">Start Free</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit">Log In</button>
            </form>
            <div class="links">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/vatsal-negi-3624a12b6/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://github.com/VatsalNegi" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.instagram.com/vatsal.negi/" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
        <div class="footer-bottom">
            &copy; 2026 CareerSphere AI 2.0. Built with ❤️ by Vatsal Negi.
        </div>
    </footer>

    <script>
        if (window.location.protocol === 'file:') {
            alert('CRITICAL ERROR: You are opening this file directly via your browser. All AI features and login will FAIL unless accessed via the server.\n\nPlease use: http://127.0.0.1:8000/static/login.html');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_name', data.user?.name || 'User');
                    localStorage.setItem('user_role', data.user?.role || 'user');
                    localStorage.setItem('user_email', data.user?.email || document.getElementById('email').value);
                    window.location.href = 'user_dashboard.html';
                } else {
                    alert(`Error: ${data.detail || 'Login failed'}`);
                }
            } catch (error) {
                alert('Connection error');
            }
        });
    </script>
</body>
</html>
